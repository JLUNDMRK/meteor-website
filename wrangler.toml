# Optional local reference for Cloudflare Pages Functions (FEAT-096).
# Do NOT put placeholder KV ids here — invalid ids break Git + Direct Uploads.
#
# Production binding is configured in Dashboard only:
#   Workers & Pages → meteor-website → Settings → Functions
#   KV namespace binding: FEEDBACK_KV → namespace e.g. meteor-feedback
#   Secret: FEEDBACK_EXPORT_TOKEN (for /api/feedback/export digest tool)
#
# Without FEEDBACK_KV the API returns mode=mailto (safe free fallback).

name = "meteor-website"
compatibility_date = "2026-10-01"
pages_build_output_dir = "."
